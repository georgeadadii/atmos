<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Atmos is a weather-aware travel planning application."
    >
    <title>Atmos</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main id="app" v-cloak>
      <section class="welcome-card" aria-labelledby="page-title">
        <p class="eyebrow">Travel with the forecast</p>
        <h1 id="page-title">Atmos</h1>
        <p class="tagline">Your weather-aware travel companion.</p>
        <p class="message" aria-live="polite">{{ message }}</p>
        <button type="button" @click="updateMessage">
          Check the atmosphere
        </button>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
